<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Recipes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F8F5FE" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1A1626" media="(prefers-color-scheme: dark)">
<title>Recipe Box</title>
<link rel="apple-touch-icon" href="/assets/images/recipe_box/app_logo_2.png">
<link rel="icon" type="image/png" href="/assets/images/recipe_box/_2.png">
<style>
:root{
  --bg:#F8F5FE; --surface:#FFFFFF; --surface-2:#EEE8FB; --ink:#2B2340; --muted:#6F6688; --line:#E3DBF4;
  --accent:#6B4FC8; --soft:#ECE4FD; --chip-on:#D9CCF8; --btn:#FFC08A; --on-btn:#3A2410;
  --orange-ink:#B4531A; --star:#F2902E; --tomato:#C2412D;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,ui-serif,Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,system-ui,"Segoe UI",Roboto,sans-serif;
  color-scheme:light dark;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#1A1626; --surface:#231E33; --surface-2:#2D2740; --ink:#F1ECFB; --muted:#A79FBE; --line:#372F4D;
    --accent:#C3B2FF; --soft:#30284A; --chip-on:#4A3D78; --btn:#FFB36E; --on-btn:#2A1606;
    --orange-ink:#FFB36E; --star:#FFB36E; --tomato:#FF8E7E;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 var(--sans);-webkit-tap-highlight-color:transparent}
a{color:var(--accent)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}

.top{position:sticky;top:0;z-index:20;background:var(--bg);display:flex;align-items:center;gap:6px;
  padding:calc(env(safe-area-inset-top,0px) + 8px) 8px 8px;border-bottom:1px solid var(--line)}
.top h1{flex:1;margin:0;font:600 21px/1.2 var(--serif);padding-left:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb{border:0;background:none;color:var(--accent);font-size:17px;padding:8px 10px;border-radius:10px;text-decoration:none;min-height:40px;display:inline-flex;align-items:center;white-space:nowrap}
.tb.strong{font-weight:600}

main{max-width:720px;margin:0 auto;padding:12px 16px calc(88px + env(safe-area-inset-bottom,0px))}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 6px;color:var(--muted);text-decoration:none;font-size:11px;position:relative}
.tabs a.on{color:var(--accent)}
.tabs svg{width:24px;height:24px}
.badge{position:absolute;top:3px;left:calc(50% + 8px);background:var(--tomato);color:#fff;font-size:11px;font-weight:700;border-radius:999px;padding:1px 6px;min-width:18px;text-align:center}

input,textarea,select{font:inherit;font-size:16px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
textarea{line-height:1.5;resize:vertical}
input[type=search]{-webkit-appearance:none;appearance:none}
.f{display:block;margin:18px 0 6px;font-size:14px;font-weight:600}
.hint{font-size:13px;color:var(--muted);margin:6px 0 0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.btn{display:block;width:100%;text-align:center;text-decoration:none;border:0;border-radius:12px;padding:12px 14px;font-weight:600;background:var(--btn);color:var(--on-btn)}
.btn.sec{background:var(--surface-2);color:var(--ink)}
.btn.danger{background:none;color:var(--tomato);border:1px solid var(--line)}
.btn.small{width:auto;padding:10px 14px}
.row{display:flex;gap:8px;margin-top:8px}
.row>.btn{flex:1}
.stack>*+*{margin-top:8px}
.muted{color:var(--muted)}
.small{font-size:13px}

.chips{display:flex;gap:8px;overflow-x:auto;margin:10px -16px 0;padding:0 16px 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:14px;white-space:nowrap}
.chip.on{background:var(--chip-on);border-color:var(--chip-on);color:var(--ink);font-weight:600}
.sugg{margin-top:8px}
.sugg .chip{font-size:13px;padding:4px 10px}

.listbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:14px 0 4px}
.listbar select{width:auto;padding:6px 10px;font-size:14px}

.rlist{list-style:none;margin:0;padding:0}
.ritem{display:flex;gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);text-decoration:none;color:inherit}
.thumb{width:68px;height:68px;flex:none;border-radius:8px;background:var(--surface-2);display:grid;place-items:center;color:var(--star);overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.rtitle{font:600 18px/1.25 var(--serif)}
.rsub{font-size:13px;color:var(--muted);margin-top:3px}
.rtags{font-size:13px;color:var(--accent);margin-top:3px}
.star{color:var(--star)}

.tip{background:var(--soft);border-radius:12px;padding:12px 14px;font-size:14px;margin-bottom:12px}
.tip button{border:0;background:none;color:var(--accent);font-weight:600;padding:6px 0 0;display:block}

.empty{text-align:center;padding:48px 8px;color:var(--muted)}
.empty .big{color:var(--star);line-height:0}
.empty h2{font:600 22px/1.25 var(--serif);color:var(--ink);margin:8px 0}
.empty .stack{max-width:300px;margin:20px auto 0}

/* detail */
.gallery{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -16px;padding:0 16px;scrollbar-width:none}
.gallery::-webkit-scrollbar{display:none}
.ph{flex:none;border:0;padding:0;background:none;scroll-snap-align:start;border-radius:12px;overflow:hidden}
.ph img{display:block;height:240px;width:auto;max-width:82vw;object-fit:cover}
.gallery.one .ph{width:100%}
.gallery.one .ph img{width:100%;max-width:none;height:260px}
.d-title{font:600 30px/1.12 var(--serif);margin:16px 0 6px;letter-spacing:-.01em}
.d-meta{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:14px;color:var(--muted)}
.d-meta b{color:var(--ink);font-weight:600}
.actions{margin:18px 0 6px}
.made{font-size:13px;color:var(--muted);margin:8px 0 0}
.part{margin-top:26px}
.sechead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px}
.part h3{font:600 21px/1.2 var(--serif);margin:0 0 6px}
.sechead h3{margin:0}
.ings{list-style:none;margin:0;padding:0}
.ings li{padding:9px 0;border-bottom:1px solid var(--line)}
.ings li.h{border:0;padding:16px 0 2px;font-weight:600;font-family:var(--serif);font-size:17px}
.steps{list-style:none;margin:0;padding:0;counter-reset:s}
.steps li{counter-increment:s;position:relative;padding:0 0 0 40px;margin-bottom:16px;line-height:1.55}
.steps li::before{content:counter(s);position:absolute;left:0;top:-1px;width:27px;height:27px;border-radius:50%;background:var(--soft);color:var(--accent);font-weight:700;font-size:14px;display:grid;place-items:center}
.notes{white-space:pre-wrap;line-height:1.55;margin:0}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;background:var(--surface);flex:none}
.stepper button{border:0;background:none;color:var(--accent);font-size:20px;width:38px;height:34px;line-height:1}
.stepper span{min-width:88px;text-align:center;font-size:14px;font-weight:600}
.stepper.sm button{width:32px;height:30px;font-size:18px}
.stepper.sm span{min-width:72px;font-size:13px}

/* grocery */
.grecs{border-bottom:1px solid var(--line);padding-bottom:10px}
.grec{display:flex;align-items:center;gap:8px;padding:6px 0}
.grec a{flex:1;min-width:0;color:var(--ink);text-decoration:none;font:600 16px/1.25 var(--serif);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.x{border:0;background:none;color:var(--muted);font-size:22px;width:36px;height:36px;line-height:1;flex:none}
.addrow{display:flex;gap:8px;margin:14px 0 4px}
.aisle h4{font-size:14px;font-weight:700;color:var(--orange-ink);margin:22px 0 2px}
.gitem{display:flex;align-items:flex-start;border-bottom:1px solid var(--line)}
.gcheck{flex:1;display:flex;gap:12px;align-items:flex-start;text-align:left;border:0;background:none;padding:11px 0}
.cb{width:24px;height:24px;flex:none;border-radius:7px;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;margin-top:-1px}
.gitem.done .cb{background:var(--btn);border-color:var(--btn)}
.gitem.done .gtext{text-decoration:line-through;color:var(--muted)}
.gtext b{font-weight:600}
.arow{display:flex;align-items:center;gap:4px;padding:8px 0;border-bottom:1px solid var(--line)}
.aname{flex:1;min-width:0;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ab{width:38px;height:38px;flex:none;border:0;border-radius:10px;background:var(--surface-2);color:var(--ink);font-size:18px;display:grid;place-items:center;padding:0}
span.ab{background:none}
.ab[disabled]{opacity:.35}
.ab.del{color:var(--tomato)}
.mv{position:relative;width:36px;height:36px;flex:none;display:grid;place-items:center;color:var(--muted);margin-top:4px}
.mv select{position:absolute;inset:0;width:100%;height:100%;opacity:0;font-size:16px;padding:0;border:0}
.gitem .x{margin-top:4px}
.gfrom{display:block;font-size:12px;color:var(--muted);margin-top:2px;text-decoration:none}

/* backup */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin:12px 0}
.panel h2{font:600 19px/1.2 var(--serif);margin:0 0 6px}
.panel p{margin:0 0 12px;font-size:14px;color:var(--muted)}
.linkbtn{border:0;background:none;color:var(--accent);font-weight:600;padding:0}
details summary{cursor:pointer;color:var(--accent);font-weight:600;font-size:15px}
details.paste{margin:0 0 6px}
details.paste[open] summary{margin-bottom:8px}
pre.code{font-size:12px;line-height:1.45;overflow-x:auto;background:var(--surface-2);padding:12px;border-radius:10px;margin:10px 0 0}

/* viewer + toast */
.viewer{position:fixed;inset:0;z-index:50;background:#000;display:flex;flex-direction:column;color:#fff;
  padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
.viewer img{flex:1;min-height:0;width:100%;object-fit:contain}
.vtop,.vbar{display:flex;align-items:center;gap:8px;padding:10px 14px}
.vtop span{flex:1;font-size:14px;opacity:.8}
.vbtn{border:0;background:rgba(255,255,255,.14);color:#fff;border-radius:10px;padding:10px 14px;font-weight:600}
.vbar .vbtn{flex:1}
.vbtn.danger{color:#FF9C8F}
.vbtn[disabled]{opacity:.5}
.toast{position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom,0px));transform:translate(-50%,12px);background:var(--ink);color:var(--bg);
  padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:60;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion: reduce){.toast{transition:none}}
</style>
</head>
<body>
<header class="top" id="top"></header>
<main id="app"></main>
<nav class="tabs" aria-label="Sections">
  <a href="#/" data-tab="recipes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M5 17a3 3 0 0 1 3-3h11"/><path d="M9 8h6"/></svg>Recipes</a>
  <a href="#/grocery" data-tab="grocery"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10 6h10M10 12h10M10 18h10"/><path d="M3.5 6l1.5 1.5L7.5 5M3.5 12l1.5 1.5 2.5-2.5M3.5 18l1.5 1.5 2.5-2.5"/></svg>Grocery<span class="badge" id="gbadge" hidden></span></a>
  <a href="#/backup" data-tab="backup"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5h18v4H3z"/><path d="M5 9v10h14V9"/><path d="M10 13h4"/></svg>Backup</a>
</nav>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<input type="file" id="photoInput" accept="image/*" multiple hidden>
<input type="file" id="importInput" accept="application/json,.json,text/plain" hidden>

<script>
'use strict';
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const cmp = (a, b) => String(a).localeCompare(String(b), undefined, {sensitivity: 'base'});
const cap = s => s ? s.charAt(0).toUpperCase() + s.slice(1) : s;
const appEl = $('#app'), topEl = $('#top');

/* ---------- storage (IndexedDB, on this device only) ---------- */
let db;
function openDB() {
  return new Promise((res, rej) => {
    const r = indexedDB.open('recipe-box', 1);
    r.onupgradeneeded = () => {
      const d = r.result;
      if (!d.objectStoreNames.contains('recipes')) d.createObjectStore('recipes', {keyPath: 'id'});
      if (!d.objectStoreNames.contains('kv')) d.createObjectStore('kv');
    };
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
const reqP = r => new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
const os = (name, mode = 'readonly') => db.transaction(name, mode).objectStore(name);
const dbAll = () => reqP(os('recipes').getAll());
const dbPut = r => reqP(os('recipes', 'readwrite').put(r));
const dbDel = id => reqP(os('recipes', 'readwrite').delete(id));
const kvGet = k => reqP(os('kv').get(k));
const kvSet = (k, v) => reqP(os('kv', 'readwrite').put(v, k));
function dbWriteMany(list, clearFirst) {
  return new Promise((res, rej) => {
    const tx = db.transaction('recipes', 'readwrite'), s = tx.objectStore('recipes');
    if (clearFirst) s.clear();
    list.forEach(r => s.put(r));
    tx.oncomplete = () => res();
    tx.onerror = () => rej(tx.error);
    tx.onabort = () => rej(tx.error);
  });
}

const S = {
  recipes: [],
  grocery: {items: [], extras: [], checked: {}, hidden: {}},
  f: {q: '', cat: '', tag: '', fav: false, sort: 'title'},
  aisleMap: {}, aisles: [], cur: null, scale: 1, editing: null, listY: 0, lastView: '', tipHidden: false, importMode: 'merge'
};
const byId = id => S.recipes.find(r => r.id === id);
const cur = () => byId(S.cur);

async function saveRecipe(r) {
  r.updated = Date.now();
  const i = S.recipes.findIndex(x => x.id === r.id);
  if (i >= 0) S.recipes[i] = r; else S.recipes.push(r);
  try { await dbPut(r); return true; }
  catch (e) { toast('Couldn’t save. Your phone’s storage may be full.'); return false; }
}
async function saveGrocery() { try { await kvSet('grocery', S.grocery); } catch (e) {} updateBadge(); }
let persistAsked = false;
function requestPersist() {
  if (persistAsked) return; persistAsked = true;
  try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {}
}

/* ---------- ingredient parsing ---------- */
/*PARSE-START*/
const UF = {'½':'1/2','⅓':'1/3','⅔':'2/3','¼':'1/4','¾':'3/4','⅕':'1/5','⅖':'2/5','⅗':'3/5','⅘':'4/5','⅙':'1/6','⅚':'5/6','⅛':'1/8','⅜':'3/8','⅝':'5/8','⅞':'7/8'};
const UF_CHARS = '½⅓⅔¼¾⅕⅖⅗⅘⅙⅚⅛⅜⅝⅞';
const NUM = String.raw`(?:\d+(?:[.,]\d+)?(?:\s+\d+\/\d+)?|\d+\/\d+)`;
const QTY_RE = new RegExp(`^(${NUM})(?:\\s*(?:-|–|—|to)\\s*(${NUM}))?(?=\\s|$|[A-Za-z(])\\s*(.*)$`);
const UNITS = {cup:'cup',cups:'cup',c:'cup',tablespoon:'tbsp',tablespoons:'tbsp',tbsp:'tbsp',tbsps:'tbsp',tbs:'tbsp',tbl:'tbsp',
  teaspoon:'tsp',teaspoons:'tsp',tsp:'tsp',tsps:'tsp',ounce:'oz',ounces:'oz',oz:'oz',pound:'lb',pounds:'lb',lb:'lb',lbs:'lb',
  gram:'g',grams:'g',g:'g',kilogram:'kg',kilograms:'kg',kg:'kg',milliliter:'ml',milliliters:'ml',millilitre:'ml',millilitres:'ml',ml:'ml',
  liter:'l',liters:'l',litre:'l',litres:'l',l:'l',clove:'clove',cloves:'clove',can:'can',cans:'can',tin:'can',tins:'can',
  pinch:'pinch',pinches:'pinch',dash:'dash',dashes:'dash',slice:'slice',slices:'slice',bunch:'bunch',bunches:'bunch',
  stick:'stick',sticks:'stick',package:'package',packages:'package',pkg:'package',packet:'package',packets:'package',
  quart:'qt',quarts:'qt',qt:'qt',pint:'pt',pints:'pt',pt:'pt',sprig:'sprig',sprigs:'sprig',head:'head',heads:'head',
  handful:'handful',handfuls:'handful',jar:'jar',jars:'jar'};
const PLURAL = {cup:'cups',clove:'cloves',can:'cans',pinch:'pinches',dash:'dashes',slice:'slices',bunch:'bunches',stick:'sticks',
  package:'packages',sprig:'sprigs',head:'heads',handful:'handfuls',jar:'jars'};
const unitLabel = (u, q) => q > 1 && PLURAL[u] ? PLURAL[u] : u;

function toNum(t) {
  return t.trim().split(/\s+/).reduce((a, p) => {
    if (p.includes('/')) { const [n, d] = p.split('/').map(Number); return a + (d ? n / d : 0); }
    return a + parseFloat(p.replace(',', '.'));
  }, 0);
}
function parseIng(raw) {
  const line = String(raw || '').trim();
  if (!line) return null;
  if (/^#/.test(line) || (/:$/.test(line) && !/^\d/.test(line)))
    return {raw: line, header: true, label: line.replace(/^#+\s*/, '').replace(/:$/, '')};
  const s = line
    .replace(new RegExp(`(\\d)\\s*([${UF_CHARS}])`, 'g'), (m, d, f) => d + ' ' + UF[f])
    .replace(new RegExp(`[${UF_CHARS}]`, 'g'), f => UF[f]);
  const m = s.match(QTY_RE);
  if (!m) return {raw: line, hasQty: false, unit: '', pre: '', item: line};
  const qty = toNum(m[1]), hi = m[2] ? toNum(m[2]) : null;
  let rest = m[3] || '', pre = '', unit = '';
  const pm = rest.match(/^(\([^)]*\))\s*(.*)$/);
  if (pm) { pre = pm[1]; rest = pm[2]; }
  const um = rest.match(/^([A-Za-z]+)\.?(?=\s|$)\s*(.*)$/);
  if (um) {
    const tok = um[1];
    const c = tok === 'T' ? 'tbsp' : tok === 't' ? 'tsp' : UNITS[tok.toLowerCase()];
    if (c) { unit = c; rest = um[2]; }
  }
  rest = rest.replace(/^of\s+/i, '');
  if (!(qty > 0)) return {raw: line, hasQty: false, unit: '', pre: '', item: line};
  return {raw: line, hasQty: true, qty, hi, unit, pre, item: rest};
}
const FR = [[0,''],[1/8,'⅛'],[1/4,'¼'],[1/3,'⅓'],[3/8,'⅜'],[1/2,'½'],[5/8,'⅝'],[2/3,'⅔'],[3/4,'¾'],[7/8,'⅞'],[1,'']];
function fmtQty(n) {
  if (!isFinite(n) || n <= 0) return '0';
  let w = Math.floor(n); const f = n - w;
  if (w >= 20) return String(Math.round(n));
  let best = null;
  for (const c of FR) if (Math.abs(f - c[0]) < 0.04 && (!best || Math.abs(f - c[0]) < Math.abs(f - best[0]))) best = c;
  if (best) {
    if (best[0] === 1) return String(w + 1);
    if (best[0] === 0) return w ? String(w) : String(Math.round(n * 100) / 100);
    return (w ? w : '') + best[1];
  }
  return String(Math.round(n * 10) / 10);
}
function amountText(qty, hi, unit) {
  return fmtQty(qty) + (hi != null && hi !== qty ? '–' + fmtQty(hi) : '') + (unit ? ' ' + unitLabel(unit, hi ?? qty) : '');
}

const PREP = /\b(finely|roughly|coarsely|thinly|freshly|chopped|minced|diced|sliced|grated|shredded|crushed|peeled|halved|quartered|cubed|melted|softened|beaten|divided|rinsed|drained|trimmed|packed|sifted|toasted|optional)\b/gi;
function cleanItem(t) {
  let s = String(t).replace(/\([^)]*\)/g, ' ').split(',')[0];

}

function resizeImage(file, max, q) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const w = img.naturalWidth, h = img.naturalHeight, s = Math.min(1, max / Math.max(w, h));

function parseWholeRecipe(text) {
  const out = {title: '', servings: null, time: '', ings: [], steps: [], notes: []};
  let mode = 'head';
  for (const t of String(text).split(/\r?\n/).map(x => x.trim())) {
    if (!t) continue;
    if (/^ingredients?\s*:?$/i.test(t)) { mode = 'ing'; continue; }
    if (/^(instructions|directions|method|steps|preparation|how to make it)\s*:?$/i.test(t)) { mode = 'step'; continue; }
    if (/^(notes?|tips?|cook'?s notes?)\s*:?$/i.test(t)) { mode = 'note'; continue; }
    if (mode === 'step' && /^step\s*\d+\s*:?$/i.test(t)) continue;
    const sv = t.match(/^(serves|servings|yield|yields|makes)\s*:?\s*(\d+(?:[.,]\d+)?)/i);
    if (sv && mode !== 'step') { out.servings = num(sv[2]); continue; }
    const tm = t.match(/^(total time|time|prep time|cook time)\s*:?\s*(.+)$/i);
    if (tm && mode === 'head') { if (!out.time || /total/i.test(tm[1])) out.time = tm[2]; continue; }
    if (mode === 'head') { if (!out.title) out.title = t; else out.notes.push(t); }
    else if (mode === 'ing') out.ings.push(t.replace(/^[-•*▢□☐]\s*/, ''));
    else if (mode === 'step') out.steps.push(stripStepNum(t));
    else out.notes.push(t);
  }
  return out;
}

const WHOLE = new Set(['', 'can', 'clove', 'head', 'bunch', 'jar', 'package']);
function buildGrocery() {
  const groups = new Map();
  for (const it of S.grocery.items) {
    const r = byId(it.rid); if (!r) continue;
    const s = it.scale || 1;
    for (const l of r.ingredients) {
      const p = parseIng(l); if (!p || p.header) continue;
      const name = cleanItem(p.hasQty ? p.item : p.raw);
      if (!name || SKIP.test(name)) continue;
      const k = keyOf(name);
      let g = groups.get(k);
      if (!g) { g = {key: k, name: cap(name), aisle: aisleFor(k, name), parts: new Map(), from: new Set()}; groups.set(k, g); }
      g.from.add(r.title);
      if (p.hasQty) {
        const pt = g.parts.get(p.unit) || {q: 0, h: 0, range: false};
        pt.q += p.qty * s; pt.h += (p.hi ?? p.qty) * s; if (p.hi != null) pt.range = true;
        g.parts.set(p.unit, pt);
      }
    }
  }
  return [...groups.values()].map(g => ({
    key: g.key, name: g.name, ak: g.key, aisle: g.aisle, from: [...g.from],
    amount: [...g.parts].map(([u, pt]) => WHOLE.has(u) ? amountText(Math.ceil(pt.q - 0.01), pt.range ? Math.ceil(pt.h - 0.01) : null, u) : amountText(pt.q, pt.range ? pt.h : null, u)).join(' + ')
  }));
}

const FIELDS = ['title', 'source', 'servings', 'time', 'category', 'tags', 'ingredients', 'steps', 'notes', 'favorite', 'made', 'photos'];
function toLines(v) {
  if (Array.isArray(v)) return v.map(x => typeof x === 'string' ? x : x && (x.text || x.name) || '').map(s => String(s).trim()).filter(Boolean);
  return lines(v);
}
function normalizeRecipe(raw) {
  const str = x => x == null ? '' : String(x).trim();
  return {
    id: raw.id != null && String(raw.id) ? String(raw.id) : uid(),
    title: str(raw.title) || 'Untitled recipe', source: str(raw.source), servings: num(raw.servings), time: str(raw.time),
    category: str(raw.category), tags: splitTags(raw.tags), ingredients: toLines(raw.ingredients),
    steps: toLines(raw.steps).map(stripStepNum), notes: str(raw.notes), favorite: !!raw.favorite,
    made: Array.isArray(raw.made) ? raw.made.filter(n => typeof n === 'number') : [],
    photos: Array.isArray(raw.photos) ? raw.photos.filter(p => p && typeof p.data === 'string' && p.data.startsWith('data:image/'))
      .map(p => ({id: String(p.id || uid()), data: p.data, thumb: typeof p.thumb === 'string' && p.thumb.startsWith('data:image/') ? p.thumb : '', date: typeof p.date === 'number' ? p.date : null})) : [],
    created: typeof raw.created === 'number' ? raw.created : Date.now(), updated: Date.now()
  };
}
async function importRecipes(list, mode, data) {
  const out = []; let added = 0, updated = 0;
  for (const raw of list) {
    if (!raw || typeof raw !== 'object') continue;
    const n = normalizeRecipe(raw);
    const ex = mode === 'merge' && raw.id != null ? byId(String(raw.id)) : null;
    if (ex) {
      const m = {...ex};
      for (const k of FIELDS) {
        if (!(k in raw)) continue;
        if (k === 'photos') m.photos = [...ex.photos, ...n.photos.filter(p => !ex.photos.some(q => q.id === p.id))];
        else if (k === 'made') m.made = [...new Set([...ex.made, ...n.made])].sort((x, y) => x - y);
        else m[k] = n[k];
      }
      m.updated = Date.now(); out.push(m); updated++;
    } else { out.push(n); added++; }
  }
  if (mode === 'replace') {
    await dbWriteMany(out, true);
    S.recipes = out;
    if (data && data.grocery && Array.isArray(data.grocery.items)) {
      S.grocery = {items: data.grocery.items, extras: data.grocery.extras || [], checked: data.grocery.checked || {}, hidden: data.grocery.hidden || {}};
    } else S.grocery.items = S.grocery.items.filter(i => byId(i.rid));
    await saveGrocery();
  } else {
    await dbWriteMany(out, false);
    for (const r of out) { const i = S.recipes.findIndex(x => x.id === r.id); if (i >= 0) S.recipes[i] = r; else S.recipes.push(r); }
  }
  if (data && data.aisles && typeof data.aisles === 'object') {
    const inc = readAisles(data.aisles);
    if (mode === 'replace') { S.aisles = inc.list; S.aisleMap = inc.map; }
    else {
      const remap = {};
      for (const a of inc.list) {
        const same = S.aisles.find(x => x.id === a.id) || S.aisles.find(x => x.name.toLowerCase() === a.name.toLowerCase());
        if (same) { remap[a.id] = same.id; if (same.id === a.id) same.name = a.name; }
        else { const oi = S.aisles.findIndex(x => x.id === 'other'); S.aisles.splice(oi < 0 ? S.aisles.length : oi, 0, a); remap[a.id] = a.id; }
      }
      for (const [k, v] of Object.entries(inc.map)) if (remap[v]) S.aisleMap[k] = remap[v];
    }
    await saveAisles();
  }
  requestPersist();
  return {added, updated};
}
async function handleImport(text, mode) {
  let data;
  try { data = JSON.parse(String(text).trim().replace(/^```(?:json)?\s*/i, '').replace(/```\s*$/, '')); }
  catch (e) { toast('That isn’t recipe data. It should start with { or [.'); return false; }
  const list = Array.isArray(data) ? data : data && Array.isArray(data.recipes) ? data.recipes : data && data.title ? [data] : null;
  if (!list || !list.length) { toast('No recipes found in that data.'); return false; }
  if (mode === 'replace' && !confirm(`Replace the ${S.recipes.length} recipe${S.recipes.length === 1 ? '' : 's'} on this phone with the ${list.length} in this backup?`)) return false;
  try {
    const {added, updated} = await importRecipes(list, mode, data);
    toast(mode === 'replace' ? `Restored ${added} recipes` : `Imported: ${added} new, ${updated} updated`);
    return true;
  } catch (e) { toast('Import failed. Your phone’s storage may be full.'); return false; }
}

      <button class="btn sec" data-act="impaste" style="margin-top:8px">Import pasted recipes</button>
      <details style="margin-top:12px"><summary>See the format</summary><pre class="code">${esc(FORMAT_EXAMPLE)}</pre>
      <p class="hint">Only “title” is required. Include an “id” to update an existing recipe instead of adding a copy.</p></details></div>`;
  drawPersist();
}
async function drawPersist() {
  const el = $('#persist'); if (!el || !navigator.storage) return;
  try {
    const p = navigator.storage.persisted ? await navigator.storage.persisted() : false;
    const est = navigator.storage.estimate ? await navigator.storage.estimate() : null;
    el.innerHTML = (p ? 'Your browser has agreed to keep this data.' : 'Your browser hasn’t promised to keep this data yet. ' +
      (navigator.storage.persist ? '<button class="linkbtn" data-act="persist">Ask it to</button>' : '')) +
      (est && est.quota ? `<br>Room for about ${fmtBytes(Math.max(0, est.quota - (est.usage || 0)))} more.` : '');
  } catch (e) {}
}

/* ---------- actions ---------- */
document.addEventListener('click', async e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act, v = b.dataset.v;
  const r = cur();
  switch (act) {
    case 'hidetip': S.tipHidden = true; kvSet('tipHidden', true).catch(() => {}); viewList(); break;
    case 'fcat': S.f.cat = v; if (!v) S.f.fav = false; drawChips(); drawResults(); break;
    case 'ffav': S.f.fav = !S.f.fav; drawChips(); drawResults(); break;
    case 'ftag': S.f.tag = S.f.tag === v ? '' : v; drawChips(); drawResults(); break;

    case 'scale': if (r) { S.scale = stepScale(r, S.scale, +b.dataset.d); drawDetail(r); } break;
    case 'fav': if (r) { r.favorite = !r.favorite; await saveRecipe(r); drawDetail(r); } break;
    case 'made': if (r) { r.made.push(Date.now()); if (await saveRecipe(r)) toast('Logged for today. Add a photo while it’s fresh?'); drawDetail(r); } break;
    case 'addphoto': $('#photoInput').click(); break;
    case 'gadd': if (r) {
      const it = S.grocery.items.find(i => i.rid === r.id);
      if (it) it.scale = S.scale; else S.grocery.items.push({rid: r.id, scale: S.scale});
      await saveGrocery(); toast(it ? 'Grocery list updated' : 'Added to grocery list'); drawDetail(r);
    } break;

    case 'vopen': V = {rid: S.cur, i: +b.dataset.i}; drawViewer(); break;
    case 'vclose': closeViewer(); break;
    case 'vmove': { const x = byId(V.rid); V.i = (V.i + +b.dataset.d + x.photos.length) % x.photos.length; drawViewer(); } break;
    case 'vcover': { const x = byId(V.rid); const [p] = x.photos.splice(V.i, 1); x.photos.unshift(p); V.i = 0; await saveRecipe(x); drawViewer(); drawDetail(x); } break;
    case 'vdel': { const x = byId(V.rid); if (!confirm('Delete this photo?')) break; x.photos.splice(V.i, 1); await saveRecipe(x); drawDetail(x); drawViewer(); } break;

    case 'save': doSave(); break;
    case 'fillpaste': fillFromPaste(); break;
    case 'pickcat': $('#e-cat').value = v; break;
    case 'picktag': { const el = $('#e-tags'); el.value = splitTags([...splitTags(el.value), v]).join(', '); } break;
    case 'delete': {
      const x = byId(S.editing); if (!x || !confirm(`Delete “${x.title}”? This can’t be undone.`)) break;
      try { await dbDel(x.id); } catch (err) {}
      S.recipes = S.recipes.filter(y => y.id !== x.id);
      S.grocery.items = S.grocery.items.filter(i => i.rid !== x.id); await saveGrocery();
      toast('Recipe deleted'); location.hash = '#/';
    } break;

    case 'gcheck': { const k = b.dataset.k; if (S.grocery.checked[k]) delete S.grocery.checked[k]; else S.grocery.checked[k] = true; await saveGrocery(); drawGrocery(); } break;
    case 'gscale': {
      const it = S.grocery.items.find(i => i.rid === b.dataset.rid), x = byId(b.dataset.rid);
      if (it && x) { it.scale = stepScale(x, it.scale || 1, +b.dataset.d); await saveGrocery(); drawGrocery(); }
    } break;
    case 'gremove': S.grocery.items = S.grocery.items.filter(i => i.rid !== b.dataset.rid); await saveGrocery(); viewGrocery(); break;
    case 'ghide': S.grocery.hidden[b.dataset.k] = true; delete S.grocery.checked[b.dataset.k]; await saveGrocery(); drawGrocery(); toast('Removed. Put it back from the bottom of the list.'); break;
    case 'gunhide': S.grocery.hidden = {}; await saveGrocery(); drawGrocery(); break;
    case 'gxadd': addExtra(); break;
    case 'aadd': case 'aren': case 'adel': case 'areset': aisleAction(act, +b.dataset.i); break;
    case 'amove': { const i = +b.dataset.i, j = i + +b.dataset.d; if (j < 0 || j >= S.aisles.length) break;
      [S.aisles[i], S.aisles[j]] = [S.aisles[j], S.aisles[i]]; await saveAisles(); drawAisles(); } break;
    case 'gxdel': S.grocery.extras = S.grocery.extras.filter(x => x.id !== b.dataset.id); delete S.grocery.checked['x:' + b.dataset.id]; await saveGrocery(); viewGrocery(); break;
    case 'guncheck': S.grocery.checked = {}; await saveGrocery(); drawGrocery(); break;
    case 'gclear': if (confirm('Clear the whole grocery list?')) { S.grocery = {items: [], extras: [], checked: {}, hidden: {}}; await saveGrocery(); viewGrocery(); } break;
    case 'gshare': {
      const text = groceryText();
      if (navigator.share) { try { await navigator.share({text}); } catch (err) {} }
      else { try { await navigator.clipboard.writeText(text); toast('List copied'); } catch (err) { toast('Sharing isn’t available here.'); } }
    } break;

    case 'exfull': exportFile(true); break;
    case 'exlite': exportFile(false); break;
    case 'excopy': copyAsText(); break;
    case 'immerge': S.importMode = 'merge'; $('#importInput').click(); break;
    case 'imreplace': S.importMode = 'replace'; $('#importInput').click(); break;
    case 'impaste': { const t = $('#pasteJson').value; if (!t.trim()) { toast('Paste recipe data into the box first.'); break; } if (await handleImport(t, 'merge')) viewBackup(); } break;
    case 'persist': try { await navigator.storage.persist(); } catch (err) {} drawPersist(); break;
  }
});
window.addEventListener('hashchange', render);

/* ---------- start ---------- */
(async () => {
  try {
    db = await openDB();
    S.recipes = (await dbAll()).map(r => ({...normalizeRecipe(r), created: r.created || Date.now(), updated: r.updated || Date.now()}));
    const g = await kvGet('grocery');
    if (g) S.grocery = {items: g.items || [], extras: g.extras || [], checked: g.checked || {}, hidden: g.hidden || {}};
    S.tipHidden = !!(await kvGet('tipHidden'));
    const al = await kvGet('aisles');
    { const r = readAisles(al); S.aisles = r.list; S.aisleMap = r.map; ensureOther(); }
  } catch (e) {
    setTop('', 'Recipe Box', '');
    appEl.innerHTML = '<div class="empty"><div class="big">' + swirl(56) + '</div><h2>Storage isn’t available</h2><p>This browser blocked on-device storage. Turn off Private Browsing, or open this page in Safari, and try again.</p></div>';
    return;
  }
  render();
  if ('serviceWorker' in navigator && window.isSecureContext) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
